[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zc-notes"
version = "0.1.0"
description = "Заметки в консоли с хранением в JSON"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest", "ruff"]

# Имя пакета (notes) не совпадает с именем проекта (zc-notes) — указать явно.
[tool.hatch.build.targets.wheel]
packages = ["src/notes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
